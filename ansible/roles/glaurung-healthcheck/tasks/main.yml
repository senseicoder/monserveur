---
- name: Créer le répertoire du script
  file:
    path: "{{ healthcheck_script_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Créer le répertoire d'état (anti-spam des alertes)
  file:
    path: "{{ healthcheck_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Déployer le script glaurung-healthcheck.sh
  template:
    src: glaurung-healthcheck.sh.j2
    dest: "{{ healthcheck_script_dir }}/glaurung-healthcheck.sh"
    owner: root
    group: root
    mode: "0750"

- name: Supprimer l'ancienne entrée crontab root (posée avant adr-cron-toujours-etc-cron-d)
  cron:
    name: "glaurung-healthcheck"
    state: absent
    user: root

- name: Planifier le cron glaurung-healthcheck (/etc/cron.d/, cf. adr-cron-toujours-etc-cron-d)
  cron:
    name: "glaurung-healthcheck"
    cron_file: glaurung-healthcheck
    minute: "{{ healthcheck_cron_minute }}"
    job: "{{ healthcheck_script_dir }}/glaurung-healthcheck.sh >> /var/log/glaurung-healthcheck.log 2>&1"
    user: root
