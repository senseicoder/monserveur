---
# Handler local au rôle : seul ce rôle le notifie (cf. CLAUDE.md, les handlers
# partagés entre rôles sont centralisés dans run_role.yml).
- name: restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  become: true
  notify: flush journald

# Bascule dans /var/log/journal ce qui est déjà dans /run/log/journal.
- name: flush journald
  ansible.builtin.command: journalctl --flush
  become: true
