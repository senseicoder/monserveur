---
# phpbb-integralsport-importdata : importe le dump prod réel (déjà rapatrié
# localement) + les uploads utilisateurs réels depuis le montage sshfs Gandi
# (avatars, pièces jointes, cache RSS -- contrairement à rat, pas de code
# à rapatrier, juste des données). Rejouable indépendamment de
# phpbb-integralsport-setup (rafraîchir les données sans reconstruire
# l'image). Prérequis : phpbb-integralsport-setup déjà passé (base + compte
# + config.php + conteneur existants) ET montage sshfs Gandi actif (cf.
# defaults/main.yml) pour la partie uploads.

- name: Copier le dump prod (déjà rapatrié) vers glaurung pour import
  ansible.builtin.copy:
    src: "/space/Work/ArchivesGandi/mysql/{{ phpbb_integralsport_dump_file }}"
    dest: "/tmp/{{ phpbb_integralsport_dump_file }}"
    mode: "0600"

- name: Importer le dump prod dans la base native (latin1, pas de passage UTF8)
  ansible.builtin.shell: |
    set -euo pipefail
    zcat /tmp/{{ phpbb_integralsport_dump_file }} | mysql --default-character-set=latin1 {{ phpbb_integralsport_db_name }}
  args:
    executable: /bin/bash

- name: Créer la table phpbb_search_results (absente du dump, cf. TESTS.md du repo)
  ansible.builtin.shell: |
    set -euo pipefail
    mysql --default-character-set=latin1 {{ phpbb_integralsport_db_name }} <<'SQL'
    CREATE TABLE IF NOT EXISTS `phpbb_search_results` (
      `search_id` int(11) unsigned NOT NULL DEFAULT '0',
      `session_id` varchar(32) NOT NULL DEFAULT '',
      `search_array` text NOT NULL,
      `search_time` int(11) NOT NULL DEFAULT '0',
      PRIMARY KEY (`search_id`),
      KEY `session_id` (`session_id`)
    ) ENGINE=MyISAM DEFAULT CHARSET=latin1;
    SQL
  args:
    executable: /bin/bash

- name: Corriger board_config pour ce déploiement de test (server_name/port/cookie_secure)
  ansible.builtin.shell: |
    set -euo pipefail
    mysql --default-character-set=latin1 {{ phpbb_integralsport_db_name }} <<'SQL'
    UPDATE phpbb_config SET config_value='{{ phpbb_integralsport_domain }}' WHERE config_name='server_name';
    UPDATE phpbb_config SET config_value='443' WHERE config_name='server_port';
    UPDATE phpbb_config SET config_value='1' WHERE config_name='cookie_secure';
    SQL
  args:
    executable: /bin/bash
  # Le dump prod importé garde la config du VRAI site (server_name=www.integralsport.com,
  # server_port=80, cookie_secure=0) -- phpBB construit ses URLs de redirection absolues
  # (includes/functions.php::redirect()) depuis CETTE config en base, pas depuis le Host
  # réel de la requête. Sans ce correctif : après login, redirection vers le vrai site de
  # prod (constaté par Cédric) ; et cookie_secure=0 aurait construit des URLs http:// alors
  # que le site n'est servi qu'en https (Traefik, TLS obligatoire sur le routeur). Rejoué à
  # chaque import (idempotent, UPDATE simple) -- ne touche jamais la vraie base de prod.

- name: Nettoyer le dump temporaire
  ansible.builtin.file:
    path: "/tmp/{{ phpbb_integralsport_dump_file }}"
    state: absent

# --- Uploads utilisateurs réels depuis Gandi (avatars, pièces jointes, cache RSS) ---
# Source résolue sur le CONTROLLER (ce poste, via le montage sshfs), destination sur
# glaurung -- ansible.posix.synchronize pousse par défaut depuis le controller vers la
# cible (mode "push"), même pattern que rat-migratefromgandi. Le montage sshfs n'est
# pas persistant : le remonter manuellement si retombé (cf. defaults/main.yml).

- name: Synchroniser les avatars réels depuis Gandi
  ansible.posix.synchronize:
    src: "{{ phpbb_integralsport_gandi_htdocs }}/images/avatars/"
    dest: "{{ phpbb_integralsport_deploy_dir }}/data/images-avatars/"
    rsync_opts:
      - "--chmod=Fugo+r,Dugo+rx"
  become: false

- name: Synchroniser les pièces jointes réelles depuis Gandi
  ansible.posix.synchronize:
    src: "{{ phpbb_integralsport_gandi_htdocs }}/files/"
    dest: "{{ phpbb_integralsport_deploy_dir }}/data/files/"
    rsync_opts:
      - "--chmod=Fugo+rw,Dugo+rwx"
  become: false

- name: Synchroniser le cache RSS réel depuis Gandi
  ansible.posix.synchronize:
    src: "{{ phpbb_integralsport_gandi_htdocs }}/cedric/rss/"
    dest: "{{ phpbb_integralsport_deploy_dir }}/data/cedric-rss/"
    rsync_opts:
      - "--chmod=Fugo+rw,Dugo+rwx"
  become: false
