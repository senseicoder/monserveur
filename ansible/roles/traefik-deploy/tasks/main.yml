---
- name: Créer les répertoires de déploiement Traefik
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ mindwtr_deploy_dir }}"
    - "{{ mindwtr_deploy_dir }}/traefik-dynamic"
    - "{{ mindwtr_deploy_dir }}/certs"
    - "{{ mindwtr_deploy_dir }}/certs/vault"
    - "{{ mindwtr_deploy_dir }}/certs/reader-daneel"
    - "{{ mindwtr_deploy_dir }}/certs/bots-plcoder"

# Options statiques de relecture-ia (core.strictTLSOptions, aliasHeadersStrategy) :
# on vérifie qu'elles existent dans l'image QUI VA TOURNER (traefik_image), et non
# un numéro de version. Incident du 2026-11-06 : contrôle « >= 3.7 » réussi sur la
# 3.7.5 de glaurung, qui ne connaît aucune des deux options → Traefik en boucle,
# tous les sites coupés 4 min. Ce contrôle tourne aussi en dry-run (check_mode:
# false, lecture seule ; il télécharge l'image si elle manque sur l'hôte).
- name: Lire les options connues de l'image Traefik (si mTLS persoca activé)
  command: "docker run --rm {{ traefik_image }} --help"
  register: traefik_aide_image
  changed_when: false
  check_mode: false
  when: traefik_mtls_persoca | bool

- name: Exiger les options mTLS persoca dans l'image Traefik
  assert:
    that:
      - "'--core.stricttlsoptions' in (traefik_aide_image.stdout | lower)"
      - "'.http.aliasheadersstrategy' in (traefik_aide_image.stdout | lower)"
    fail_msg: >-
      L'image {{ traefik_image }} ne connaît pas --core.strictTLSOptions et/ou
      --entrypoints.<name>.http.aliasHeadersStrategy : Traefik refuserait de démarrer.
      Choisir une image qui les a (validées : traefik:v3.7.15) avant d'activer traefik_mtls_persoca.
  when: traefik_mtls_persoca | bool

- name: Déployer docker-compose.traefik.yml
  template:
    src: docker-compose.traefik.yml.j2
    dest: "{{ mindwtr_deploy_dir }}/docker-compose.traefik.yml"
    owner: root
    group: root
    mode: "0640"
  notify: restart traefik

- name: Déployer la configuration TLS dynamique Traefik
  template:
    src: traefik-tls.yml.j2
    dest: "{{ mindwtr_deploy_dir }}/traefik-dynamic/tls.yml"
    owner: root
    group: root
    mode: "0640"
  notify: restart traefik

- name: Déployer les routers file-provider vers Apache backend (vhosts legacy)
  template:
    src: traefik-routers-apache.yml.j2
    dest: "{{ mindwtr_deploy_dir }}/traefik-dynamic/apache-routers.yml"
    owner: root
    group: root
    mode: "0640"
  notify: restart traefik

- name: Copier les certs existants reader.daneel.net / bots.plcoder.net (déjà obtenus par l'ancien Apache+certbot)
  copy:
    src: "{{ item.src }}"
    dest: "{{ mindwtr_deploy_dir }}/certs/{{ item.dir }}/{{ item.dest }}"
    remote_src: true
    owner: root
    group: root
    mode: "0640"
  loop:
    - { src: /etc/letsencrypt/live/reader.daneel.net/fullchain.pem, dir: reader-daneel, dest: fullchain.pem }
    - { src: /etc/letsencrypt/live/reader.daneel.net/privkey.pem, dir: reader-daneel, dest: privkey.pem }
    - { src: /etc/letsencrypt/live/bots.plcoder.net/fullchain.pem, dir: bots-plcoder, dest: fullchain.pem }
    - { src: /etc/letsencrypt/live/bots.plcoder.net/privkey.pem, dir: bots-plcoder, dest: privkey.pem }
  notify: restart traefik

- name: Installer le hook de renouvellement certbot
  template:
    src: certbot-renewal-hook.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-traefik.sh
    owner: root
    group: root
    mode: "0755"

- name: Démarrer Traefik
  command: docker-compose -f {{ mindwtr_deploy_dir }}/docker-compose.traefik.yml up -d
  args:
    chdir: "{{ mindwtr_deploy_dir }}"
  changed_when: false
  ignore_errors: "{{ ansible_check_mode }}"
