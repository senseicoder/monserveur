---
# rat-migratefromgandi : rapatrie UNIQUEMENT les données réelles depuis Gandi
# (montage sshfs) et importe les dumps prod dans les bases créées par
# rat-setup. Ne s'occupe ni de config.php ni de l'arborescence rat_donnees
# (déplacés vers rat-setup — ce sont des artefacts de config/infra, pas des
# données Gandi). Rejouable indépendamment (ex. rafraîchir les données avant
# la bascule finale) sans reconstruire l'image ni retoucher la conf MySQL/
# Traefik/config.php. Prérequis : rat-setup déjà passé (dossiers + bases +
# comptes + config.php + rat_donnees existants).

# --- Données spécifiques par site, depuis le montage sshfs Gandi ---
# Exclusions : rat_code/admin (vieux PHP5, gérés par rat-setup depuis rat-git),
# rat_donnees (logs/sessions sans valeur, et config.php géré par rat-setup —
# ne pas écraser), et le contenu legacy statique (hors périmètre, décidé avec
# Cédric : reste sur Gandi).

- name: Synchroniser les données réelles de chaque site depuis Gandi (rsync sélectif)
  ansible.posix.synchronize:
    src: "{{ rat_gandi_mount }}/{{ item.domain }}/htdocs/"
    dest: "{{ rat_deploy_dir }}/data/{{ item.domain }}/htdocs/"
    rsync_opts:
      - "--exclude=rat_code"
      - "--exclude=admin"
      - "--exclude=rat_donnees"
      - "--exclude=nimes2006"
      - "--exclude=nimes2007"
      - "--exclude=brunstatt2007"
      - "--exclude=pub"
      # rsync -a préserve les permissions d'origine Gandi (constaté :
      # rat_sites/PLC/site.php en 600, owner cedric -- illisible par
      # www-data dans le conteneur, "Permission denied" à l'include).
      # Le contenu Gandi n'a jamais été pensé pour un autre user que le
      # sien. Écriture nécessaire aussi (pas juste lecture) : la génération
      # RAT réécrit des fichiers dans rat_sites/ (blocs, données, rss.php
      # régénéré) -- constaté : "Permission denied" en écriture après un
      # premier fix lecture-seule.
      - "--chmod=Fugo+rw,Dugo+rwx"
  become: false
  loop: "{{ rat_sites }}"
  loop_control:
    label: "{{ item.domain }}"

# --- Conversion d'encodage des données spécifiques par site ---
# rat_code/admin (générique) sont déjà en UTF-8 depuis les tickets 2B/2C
# du repo rat-git. Les données rsync'ées ci-dessus (rat_sites/, modeles/)
# viennent de Gandi et restent en ISO-8859-1 -- mojibake constaté sur
# toutes les pages utilisant un template encore dans cet état (cf. wiki
# migration-rat-docker.md, section "Mojibake confirmé sur les templates
# spécifiques par site", 2026-08-03). Idempotent : un fichier déjà en
# UTF-8 valide est laissé intact, rejouable sans risque à chaque rafraîchissement
# de données.

- name: Convertir l'encodage ISO-8859-1 -> UTF-8 des données spécifiques par site
  ansible.builtin.script:
    cmd: "files/convert-site-encoding.sh {{ rat_deploy_dir }}/data/{{ item.domain }}/htdocs"
  become: false
  loop: "{{ rat_sites }}"
  loop_control:
    label: "{{ item.domain }}"
  register: rat_encoding_conversion
  changed_when: "'CONVERTI' in rat_encoding_conversion.stdout"
  tags: [encoding-convert]

# --- Import des dumps prod dans les bases (créées vides par rat-setup) ---

- name: Copier les dumps prod (déjà rapatriés) vers glaurung pour import
  ansible.builtin.copy:
    src: "/space/Work/ArchivesGandi/mysql/{{ item.dump }}"
    dest: "/tmp/{{ item.dump }}"
    mode: "0600"
  loop:
    - { db_name: rat_plc, dump: "rat_plc_2026-07-14_00h56m44s.sql.gz" }
    - { db_name: pds, dump: "pds_2026-07-14_00h55m55s.sql.gz" }
  loop_control:
    label: "{{ item.db_name }}"

- name: Importer les dumps prod dans les bases natives
  ansible.builtin.shell: |
    set -euo pipefail
    zcat /tmp/{{ item.dump }} | mysql --default-character-set=latin1 {{ item.db_name }}
  args:
    executable: /bin/bash
  loop:
    - { db_name: rat_plc, dump: "rat_plc_2026-07-14_00h56m44s.sql.gz" }
    - { db_name: pds, dump: "pds_2026-07-14_00h55m55s.sql.gz" }
  loop_control:
    label: "{{ item.db_name }}"

- name: Nettoyer les dumps temporaires
  ansible.builtin.file:
    path: "/tmp/{{ item.dump }}"
    state: absent
  loop:
    - { dump: "rat_plc_2026-07-14_00h56m44s.sql.gz" }
    - { dump: "pds_2026-07-14_00h55m55s.sql.gz" }
  loop_control:
    label: "{{ item.dump }}"
