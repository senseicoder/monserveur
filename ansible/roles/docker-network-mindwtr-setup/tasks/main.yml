---
- name: Déployer la configuration du daemon Docker
  template:
    src: docker-daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  register: docker_daemon

- name: "Inspecter le réseau Docker {{ docker_network_name }}"
  command: "docker network inspect {{ docker_network_name }}"
  register: mindwtr_net_inspect
  failed_when: false
  changed_when: false
  check_mode: false  # lecture seule, sans effet de bord — à exécuter aussi en --check

- name: Détecter si le réseau a IPv6 activé
  set_fact:
    mindwtr_net_ipv6: >-
      {{ ((mindwtr_net_inspect.stdout | default('') | from_json)[0].EnableIPv6)
         if (mindwtr_net_inspect.rc | default(1)) == 0 and (mindwtr_net_inspect.stdout | default('') | length > 0)
         else false }}

# Reconfiguration Docker si daemon.json ou réseau a changé.
# Ordre : arrêt de TOUS les services du réseau {{ docker_network_name }} → redémarrage
# Docker → suppression réseau → recréation. Avant le 2026-09-05, ce loop n'arrêtait que
# traefik/mindwtr-cloud — vaultwarden, ntfy, puttini, rat-web, phpbb-integralsport et
# pub-daneel-net restaient connectés à l'ancien réseau jusqu'à leur propre redémarrage
# en cas de recréation du réseau (cf. TODO.md § loop d'arrêt). Corrigé en couvrant
# explicitement le docker-compose de chaque service, avec son répertoire propre (ils
# ne sont pas tous dans mindwtr_deploy_dir).

- name: "Arrêter tous les services du réseau {{ docker_network_name }} (avant reconfiguration)"
  command: "docker-compose -f {{ item.dir }}/docker-compose.{{ item.file }}.yml down"
  args:
    chdir: "{{ item.dir }}"
  loop:
    - { dir: "{{ mindwtr_deploy_dir }}", file: "traefik" }
    - { dir: "{{ mindwtr_deploy_dir }}", file: "mindwtr" }
    - { dir: "{{ mindwtr_deploy_dir }}", file: "vaultwarden" }
    - { dir: "{{ mindwtr_deploy_dir }}", file: "ntfy" }
    - { dir: "{{ mindwtr_deploy_dir }}", file: "puttini" }
    - { dir: "{{ mindwtr_deploy_dir }}", file: "ttrss" }
    - { dir: "{{ rat_deploy_dir }}", file: "rat" }
    - { dir: "{{ phpbb_integralsport_deploy_dir }}", file: "phpbb-integralsport" }
    - { dir: "{{ pub_daneel_net_deploy_dir }}", file: "pub-daneel-net" }
  loop_control:
    label: "{{ item.file }}"
  when: docker_daemon is changed or not mindwtr_net_ipv6
  ignore_errors: true

- name: Redémarrer Docker si daemon.json modifié
  systemd:
    name: docker
    state: restarted
  when: docker_daemon is changed

- name: "Supprimer le réseau {{ docker_network_name }} si IPv6 absent (sera recréé avec IPv6)"
  command: "docker network rm {{ docker_network_name }}"
  when: not mindwtr_net_ipv6
  register: net_rm
  failed_when: net_rm.rc != 0 and 'No such network' not in net_rm.stderr
  ignore_errors: "{{ ansible_check_mode }}"

- name: Démarrer et activer Docker
  systemd:
    name: docker
    state: started
    enabled: true

- name: "Créer le réseau Docker {{ docker_network_name }} (IPv6) — partagé par toute la stack, pas propre à mindwtr-cloud"
  command: "docker network create --ipv6 --subnet fd00:0:0:1::/64 {{ docker_network_name }}"
  register: network_result
  failed_when: network_result.rc != 0 and 'already exists' not in network_result.stderr
  changed_when: network_result.rc == 0
