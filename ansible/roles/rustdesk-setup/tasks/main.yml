---
- name: Créer le répertoire de déploiement rustdesk
  file:
    path: "{{ deploy_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Créer le répertoire data (clé id_ed25519 persistée)
  file:
    path: "{{ deploy_dir }}/data"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Déployer docker-compose.rustdesk.yml
  template:
    src: docker-compose.rustdesk.yml.j2
    dest: "{{ deploy_dir }}/docker-compose.rustdesk.yml"
    owner: root
    group: root
    mode: "0640"
  register: rustdesk_compose

- name: Démarrer hbbs + hbbr
  command: docker-compose -f {{ deploy_dir }}/docker-compose.rustdesk.yml up -d
  args:
    chdir: "{{ deploy_dir }}"
  changed_when: false
  ignore_errors: "{{ ansible_check_mode }}"

- name: Redémarrer la stack si le compose a changé
  command: docker-compose -f {{ deploy_dir }}/docker-compose.rustdesk.yml up -d --force-recreate
  args:
    chdir: "{{ deploy_dir }}"
  when: rustdesk_compose is changed and not ansible_check_mode
  changed_when: true

# --- Export de l'état en ligne des pairs (monserveur#39) ---------------------

- name: Créer le répertoire du script d'export des pairs
  file:
    path: "{{ rustdesk_pairs_export_script_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: rustdesk_pairs_export_enabled | bool

- name: Déployer le script d'export des pairs
  copy:
    src: rustdesk-pairs-export.py
    dest: "{{ rustdesk_pairs_export_script_dir }}/rustdesk-pairs-export.py"
    owner: root
    group: root
    mode: "0755"
  when: rustdesk_pairs_export_enabled | bool

- name: Planifier l'export des pairs (/etc/cron.d/, cf. adr-cron-toujours-etc-cron-d)
  cron:
    name: "rustdesk-pairs-export"
    cron_file: rustdesk-pairs-export
    user: root
    minute: "{{ rustdesk_pairs_export_cron_minute }}"
    job: >-
      /usr/bin/python3 {{ rustdesk_pairs_export_script_dir }}/rustdesk-pairs-export.py
      --base {{ rustdesk_pairs_export_base }}
      --hbbs {{ rustdesk_pairs_export_hbbs }}
      --sortie {{ rustdesk_pairs_export_sortie }}
      >> {{ rustdesk_pairs_export_log }} 2>&1
    state: "{{ 'present' if rustdesk_pairs_export_enabled | bool else 'absent' }}"
